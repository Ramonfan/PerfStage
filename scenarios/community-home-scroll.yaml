id: community-home-scroll
name: 社区首页上滑滚动（5 次）
app:
  bundleId: com.nndev.im
device: {}
preconditions:
  foregroundBundleId: com.nndev.im
  accessibilityText: 社区
# The app launches straight into NNCommunity.CommunityHomeNextVC, so no warmup
# tap is needed (and tapping a non-existent 社区 label fails the Take).
warmup: []
actions:
  - id: scroll-up-1
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-2
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-3
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-4
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-5
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
metrics:
  # Thresholds and regression tolerances are calibrated from 5 same-device,
  # same-build takes; see docs/threshold-calibration.md for sample runIds,
  # statistics and formulas. They describe this scenario on this device class
  # only — re-calibrate when the workload or target device changes.
  - name: hitches
    instrument: Animation Hitches
    threshold:
      warn: 564
      fail: 705
    regression:
      worse: higher
      maxWorseningPercent: 20
  - name: blockMs
    instrument: Animation Hitches
    threshold:
      warn: 130
      fail: 150
    # The observed spread is 250%, so this tolerance cannot separate normal
    # jitter from regression; the absolute threshold above carries the gate.
    regression:
      worse: higher
      maxWorseningPercent: 250
  - name: launchMs
    instrument: App Launch
    threshold:
      warn: 428
      fail: 519
    # Cold starts were bimodal (two takes near 560 ms); a wide tolerance is
    # reported as weak discrimination rather than hidden.
    regression:
      worse: higher
      maxWorseningPercent: 75
  - name: memoryMB
    instrument: Activity Monitor
    threshold:
      warn: 119
      fail: 137
    regression:
      worse: higher
      maxWorseningPercent: 5
      # Observed range across the 5 calibration takes was 2.94 MB, so a 2 MB
      # absolute cap flagged normal jitter; 3 MB covers the measured spread.
      maxWorseningAbsolute: 3
