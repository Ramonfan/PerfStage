id: community-home-scroll
name: 社区首页上滑滚动（5 次）
app:
  bundleId: com.nndev.im
device: {}
preconditions:
  foregroundBundleId: com.nndev.im
  accessibilityText: 社区
# The app launches straight into NNCommunity.CommunityHomeNextVC, so no warmup
# tap is needed (and tapping a non-existent 社区 label fails the Take).
warmup: []
actions:
  - id: scroll-up-1
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-2
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-3
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-4
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
  - id: scroll-up-5
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 500
metrics:
  - name: hitches
    instrument: Animation Hitches
    threshold:
      warn: 5
      fail: 15
  - name: blockMs
    instrument: Animation Hitches
    threshold:
      warn: 100
      fail: 250
  - name: launchMs
    instrument: App Launch
    threshold:
      warn: 800
      fail: 1500
  - name: memoryMB
    instrument: Activity Monitor
    threshold:
      warn: 300
      fail: 500
analysisFocus:
  - jank
  - startup
  - memory
