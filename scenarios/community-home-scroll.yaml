id: community-home-scroll
name: 社区首页来回滚动
app:
  bundleId: com.nndev.im
device: {}
preconditions:
  foregroundBundleId: com.nndev.im
  accessibilityText: 社区
warmup:
  - id: open-community
    type: tap
    target: 社区
    waitAfterMs: 1500
actions:
  - id: scroll-up-1
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 1500
  - id: scroll-down-1
    type: swipe
    direction: down
    distance: 700
    durationMs: 500
    waitAfterMs: 1500
metrics:
  - name: hitches
    instrument: Animation Hitches
    threshold:
      warn: 5
      fail: 15
  - name: blockMs
    instrument: Animation Hitches
    threshold:
      warn: 100
      fail: 250
  - name: launchMs
    instrument: App Launch
    threshold:
      warn: 800
      fail: 1500
  - name: memoryMB
    instrument: Activity Monitor
    threshold:
      warn: 300
      fail: 500
analysisFocus:
  - jank
  - startup
  - memory
