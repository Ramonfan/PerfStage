id: message-list-scroll
name: 消息列表来回滚动
app:
  bundleId: com.nndev.im
device: {}
preconditions:
  foregroundBundleId: com.nndev.im
  accessibilityText: 消息
warmup:
  - id: open-message-tab
    type: tap
    target: 消息
    waitAfterMs: 1500
actions:
  - id: scroll-up-1
    type: swipe
    direction: up
    distance: 700
    durationMs: 500
    waitAfterMs: 1500
  - id: scroll-down-1
    type: swipe
    direction: down
    distance: 700
    durationMs: 500
    waitAfterMs: 1500
metrics:
  # Thresholds and regression tolerances are calibrated from 5 same-device,
  # same-build takes; see docs/threshold-calibration.md for sample runIds,
  # statistics and formulas.
  - name: hitches
    instrument: Animation Hitches
    threshold:
      warn: 133
      fail: 153
    regression:
      worse: higher
      maxWorseningPercent: 20
  - name: blockMs
    instrument: Animation Hitches
    threshold:
      warn: 59
      fail: 68
    regression:
      worse: higher
      maxWorseningPercent: 45
  - name: launchMs
    instrument: App Launch
    threshold:
      warn: 398
      fail: 497
    regression:
      worse: higher
      maxWorseningPercent: 10
  - name: memoryMB
    instrument: Activity Monitor
    threshold:
      warn: 119
      fail: 137
    regression:
      worse: higher
      maxWorseningPercent: 5
      maxWorseningAbsolute: 2
